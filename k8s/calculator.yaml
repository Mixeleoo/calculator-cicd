apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  namespace: calculator
  labels:
    app: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
        - name: calculator
          image: calc-calculator:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: WORK_MS
              value: "0"
            - name: TIMEOUT_MS
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-service
  namespace: calculator
spec:
  type: NodePort
  selector:
    app: calculator
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sum
  namespace: calculator
  labels:
    app: sum
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sum
  template:
    metadata:
      labels:
        app: sum
    spec:
      containers:
        - name: sum
          image: calc-sum:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: WORK_MS
              value: "0"
---
apiVersion: v1
kind: Service
metadata:
  name: sum-service
  namespace: calculator
spec:
  type: NodePort
  selector:
    app: sum
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31001
---
