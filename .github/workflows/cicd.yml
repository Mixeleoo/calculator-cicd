name: calculator-cicd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: self-hosted
    env:
      SERVICES: "calculator sum sub mul div"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        shell: bash
        run: |
          for s in $SERVICES; do
            docker build --target test -t calc-$s-test services/$s
          done

      - name: Build
        shell: bash
        run: |
          TAG=${GITHUB_SHA::7}
          for s in $SERVICES; do
            docker build -t calc-$s:$TAG services/$s
          done

      - name: Deploy
        shell: bash
        run: |
          TAG=${GITHUB_SHA::7}
          kubectl config use-context docker-desktop
          for f in k8s/*.yaml; do
            sed "s/IMAGE_TAG/$TAG/g" "$f" | kubectl apply -f -
          done
          for s in $SERVICES; do
            kubectl -n calculator rollout status deployment/$s --timeout=180s
          done
